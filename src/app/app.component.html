<app-navbar></app-navbar>

<main class="portfolio-main">
  <router-outlet></router-outlet>
</main>

<div
  class="contact-modal-backdrop"
  *ngIf="isContactModalOpen"
  (click)="closeContactModal()"
>
  <div class="contact-modal" (click)="$event.stopPropagation()">
    <button class="modal-close-btn" type="button" (click)="closeContactModal()" aria-label="Close contact form">
      <i class="bi bi-x-lg"></i>
    </button>

    <div class="modal-header">
      <span class="modal-badge">Contact Me</span>
      <h2>Request a Service</h2>
      <p>Tell me about your project and I will get back to you soon.</p>
    </div>

    <form class="contact-form" (ngSubmit)="submitContactForm()">
      <div class="form-group">
        <label for="contact-name">Full Name</label>
        <input id="contact-name" type="text" [(ngModel)]="fullName" name="fullName" placeholder="Enter your full name" required />
      </div>

      <div class="form-group">
        <label for="contact-phone">Phone Number</label>
        <input id="contact-phone" type="tel" [(ngModel)]="phone" name="phone" placeholder="Enter your phone number" required />
      </div>

      <div class="form-group">
        <label for="contact-email">Email Address</label>
        <input id="contact-email" type="email" [(ngModel)]="email" name="email" placeholder="Enter your email address" required />
      </div>

      <div class="form-group">
        <label for="contact-service">Service Needed</label>
        <input id="contact-service" type="text" [value]="selectedService" readonly />
      </div>

      <div class="form-group">
        <label for="contact-request">Project Details</label>
        <textarea id="contact-request" [(ngModel)]="request" name="request" rows="4" placeholder="Tell me about your requirements" required></textarea>
      </div>

      <button class="submit-contact-btn" type="submit">
        <i class="bi bi-send"></i>
        Send Request
      </button>
    </form>
  </div>
</div>

<app-footer></app-footer>
